<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8' />
    <title>my First Map</title>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
   </style>
</head>
<body>
   <div id='map'></div>
   <script>
      mapboxgl.accessToken = 'pk.eyJ1IjoianVuc2VpdCIsImEiOiJjbXY1dnhwMngwMzFmMnhwdXpjM2V5OGxqIn0.dSmEOsnTEJ5uP2pj0qv9xA';
      const mymap = new mapboxgl.Map({
             container: 'map',
             //style: 'mapbox://styles/mapbox/navigation-night-v1',
             //projection: 'globe', //Display the map as a globe since satellite-v9 defaults to Mercator
             //center: [-122.309571, 47.655825], replaced with coordinate for red square
            //zoom:16 //zoomed in sufficiently to identify the campus
             center: [-122.2054, 47.7623,],
             //Bothell
             zoom:11
             
          });
// code from the next step will go here!
mymap.addControl(new mapboxgl.FullscreenControl());
mymap.addControl(new mapboxgl.NavigationControl());
mymap.on('style.load', () => {
    mymap.setConfigProperty('basemap', 'lightPreset', 'dusk');
    mymap.setConfigProperty('basemap', 'showPointOfInterestLabels', false);
    mymap.setconfigproperty('basemap', 'showTransitLabels', false);
    mymap.setconfigproperty('basemap', 'theme', 'faded');
    // I got rid of all transit labels because showing that was not the point of the map
    mymap.setconfigpropoerty('basemap', 'font', 'EB Garamond');
    // This font was chosen because it has as professional yet artistic feel
});
</script>
</body>
</html>
