<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>My First Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
            /* Layout of the legend panel. */
#legend {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 130px;
    background: #fff;
    margin-right: 20px;
    margin-bottom: 40px;
    padding: 10px 20px 10px 10px;
    border-radius: 3px;
    text-align: center;
}

/* Each row for a magnitude value. */
.break {
    position: relative;
    margin: 0;
    padding: 0;
}

/* The circular symbol. */
.dot {
    display: inline-block;
    margin-top: 5px;
    border-radius: 50%;
    opacity: 1;
}

/* Label next to the symbol. */
.dot-label {
    position: absolute;
    top: 0;
    right: 0;
    font-style: italic;
}

/* Link color within the legend. */
#legend a {
    color: black;
}
    </style>

    </head>
<body>
    <div id="map"></div>
    <div id="legend"></div>
    <script>
        // Your map code goes here.
    </script>
</body>
    

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoianVuc2VpdCIsImEiOiJjbXY1dnhwMngwMzFmMnhwdXpjM2V5OGxqIn0.dSmEOsnTEJ5uP2pj0qv9xA';
        const mymap = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/satellite-v9',
            projection: 'globe',
            center: [-96, 37.8],
            zoom: 1,

        });

        // Add the next steps here, inside this script.
        mymap.on('style.load', () => {
    mymap.setFog({});
});
        mymap.on('load', () => {
            mymap.addSource('earthquakes', {
                type: 'geojson',
                data: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson'
            });

        mymap.addLayer({
        id: 'earthquakes-layer',
        type: 'circle',
        source: 'earthquakes',
        paint: {
            'circle-radius': [
    'interpolate', ['linear'],
    ['to-number', ['get', 'mag'], 0],
    1,    0.7,
    1.5,  2,
    2,    4,
    2.5,  5,
    3,    6,
    3.5,  7,
    4.5,  9,
    6.5,  15,
    8.5,  17,
    10.5, 30
],
            'circle-stroke-width': 1,
            'circle-color': [
    'interpolate', ['linear'],
    ['to-number', ['get', 'mag'], 0],
    1,    '#fde0dd',
    1.5,  '#fee8c8',
    2,    '#EDC2BE',
    2.5,  '#F0AFD9',
    3,    '#E67EC2',
    3.5,  '#C51b8a',
    4.5,  '#940A64',
    6.5,  '#C21919',
    8.5,  '#7f0000',
    10.5, '#000000'
],
            'circle-stroke-color': 'white'
            }
            });
            
            
            // Click an earthquake circle to view its magnitude.
mymap.on('click', 'earthquakes-layer', (event) => {
    const feature = event.features[0];
    const coordinates = feature.geometry.coordinates.slice(0, 2);

    new mapboxgl.Popup()
        .setLngLat(coordinates)
        .setHTML(`<strong>Magnitude:</strong> ${feature.properties.mag}`)
        .addTo(mymap);
});
        });
// Anchor the legend to the HTML element with id="legend".
const legend = document.getElementById('legend');
const grades = [ 2, 5, 7, 9];
const radii = [ 4, 9, 15, 17];
const colors = ['#EDC2BE', '#940A64', '#C21919', '#7f0000'];
const labels = ['<strong>Magnitude</strong>'];

for (let i = 0; i < grades.length; i++) {
    const value = grades[i];
    const diameter = 2 * radii[i];

    labels.push(
        '<p class="break"><i class="dot" style="background:' + colors[i] +
        '; width:' + diameter + 'px; height:' + diameter +
        'px;"></i> <span class="dot-label" style="top:' +
        diameter / 2 + 'px;">' + value + '</span></p>'
    );
}

const source =
    '<p style="text-align:right; font-size:10pt;">Source: ' +
    '<a href="https://earthquake.usgs.gov/earthquakes/">USGS</a></p>';

legend.innerHTML = labels.join('') + source;
    </script>
</body>
</html>
